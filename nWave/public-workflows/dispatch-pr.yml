# =============================================================================
# Public PR Sync — Dispatcher (runs on public repo nWave-ai/nWave)
# =============================================================================
#
# Purpose: when a PR is opened/updated/reopened on the public repo, dispatch
# the PR metadata to nwave-dev (private) so it can be mirrored as
# pr-mirror/<N> and run internal CI.
#
# SECURITY — this file is the fork-safety boundary. Do NOT add:
#   - actions/checkout of the PR head
#   - any step that executes PR-supplied code
#   - write permissions on the public repo
#
# Only the event payload (which GitHub controls) is forwarded. Private-side
# denylist + first-contributor approval gate (GitHub repo setting) provide
# defense in depth.
#
# Managed from: nwave-dev/nWave/public-workflows/dispatch-pr.yml
# Synced to:    .github/workflows/dispatch-pr.yml on every stable release via
#               release-prod.yml's sync-public job.
# Bootstrap:    one-time direct commit to nWave-ai/nWave main to seed the file.
# =============================================================================

name: Dispatch PR to nwave-dev

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dispatch-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: "Dispatch PR metadata to nwave-dev"
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Send repository_dispatch to nwave-dev
        env:
          DISPATCH_TOKEN: ${{ secrets.NWAVE_DEV_DISPATCH }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # No checkout. Event payload only. Fork content is never executed.
          # jq assembles a strict JSON body; bash concatenation would be
          # injection-prone if any value ever contained unbalanced quotes.
          BODY=$(jq -n \
            --arg pr_number   "$PR_NUMBER" \
            --arg head_sha    "$HEAD_SHA" \
            --arg base_ref    "$BASE_REF" \
            --arg base_sha    "$BASE_SHA" \
            --arg author      "$AUTHOR" \
            '{event_type: "public_pr_sync",
              client_payload: {
                pr_number: ($pr_number | tonumber),
                head_sha:  $head_sha,
                base_ref:  $base_ref,
                base_sha:  $base_sha,
                author:    $author
              }}')

          HTTP_STATUS=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/nWave-ai/nwave-dev/dispatches \
            -d "$BODY")

          echo "Dispatch HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "204" ]; then
            echo "::error::repository_dispatch failed"
            cat /tmp/dispatch.out
            exit 1
          fi
          echo "Dispatched public_pr_sync for PR #$PR_NUMBER (head=$HEAD_SHA, base=$BASE_SHA)"
