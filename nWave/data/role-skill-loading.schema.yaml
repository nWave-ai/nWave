$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [version, roles]
additionalProperties: false
properties:
  version: { const: 1 }
  global_on_demand: { $ref: "#/$defs/triggers" }
  roles:
    type: object
    minProperties: 1
    additionalProperties: false
    patternProperties:
      ^nw-[a-z0-9-]+$: { $ref: "#/$defs/role" }
$defs:
  triggers:
    type: object
    additionalProperties: { type: string, minLength: 3 }
  role:
    type: object
    additionalProperties: false
    properties:
      on_demand: { $ref: "#/$defs/triggers" }
      phase: { $ref: "#/$defs/triggers" }
      paradigm:
        type: object
        additionalProperties: false
        patternProperties:
          ^(object_oriented|functional)$: { type: string, pattern: "^nw-[a-z0-9-]+$" }
      language_pbt:
        type: object
        additionalProperties: { type: string, pattern: "^nw-pbt-[a-z0-9-]+$" }
      reviewer_of:
        type: array
        items: { type: string, pattern: "^nw-[a-z0-9-]+$" }
        uniqueItems: true
      catalog_only:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, pattern: "^nw-[a-z0-9-]+$" }
