[build-system]
requires = ["hatchling==1.33.0", "pip>=26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nwave_ai"]

[tool.hatch.build.targets.wheel.force-include]
"nWave/agents" = "nWave/agents"
"nWave/skills" = "nWave/skills"
"nWave/tasks/nw" = "nWave/tasks/nw"
"nWave/templates" = "nWave/templates"
".nwave-wheel-assets/templates" = "nWave/nWave/templates"
"nWave/data" = "nWave/data"
".nwave-wheel-assets/data" = "nWave/nWave/data"
"nWave/schemas" = "nWave/nWave/schemas"
".nwave-wheel-assets/framework-catalog.yaml" = "nWave/nWave/framework-catalog.yaml"
"nWave/framework-catalog.yaml" = "nWave/framework-catalog.yaml"
"scripts/hooks/git_stash_guard.py" = "nWave/nWave/hooks/git_stash_guard.py"
"nWave/README.md" = "nWave/README.md"
"scripts/install" = "scripts/install"
"scripts/shared" = "scripts/shared"
"scripts/docs_site/static/logo.svg" = "scripts/docs_site/static/logo.svg"
"scripts/install_nwave_target_hooks.py" = "scripts/install_nwave_target_hooks.py"
"scripts/validate_step_file.py" = "scripts/validate_step_file.py"
"src/nwdes" = "nwdes"
"src/codefact" = "codefact"
"src/nwave_capture" = "nwave_capture"

[tool.hatch.build.hooks.custom]
path = "scripts/release/offline_wheelhouse_hook.py"

[project]
name = "nwave-ai"
version = "4.3.0"
description = "Modern CLI installer for nwave with rich terminal UI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    { name = "Michele Brissoni", email = "michele.brissoni@brix.consulting" },
    { name = "Alessandro Di Gioia", email = "alessandro.digioia@brix.consulting" }
]
contributors = [
    { name = "Fabio (@lagom1985)" }
]
keywords = [
    "cli",
    "installer",
    "ai",
    "developer-tools",
    "automation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Typing :: Typed"
]

dependencies = [
    "rich>=13.7.0",
    "typer>=0.27.3",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "httpx>=0.27.0",
    "platformdirs>=4.14.3",
    "pyyaml>=6.0",
    "packaging>=26.3",
    "typing_extensions>=4.16.0",
    "jsonschema>=4.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=9.2.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-xdist>=3.5.0",
    "pytest-bdd>=9.0.1",
    "respx>=0.20.0",
    "jsonschema>=4.0.0"
]

[dependency-groups]
# Local dev toolchain (PEP 735). Installed by default on `uv sync`.
# Not published in package metadata (unlike the `test` extra above).
dev = [
    # Testing
    "pytest>=9.2.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-xdist>=3.5.0",
    "pytest-bdd>=9.0.1",
    "pytest-html>=4.0.0",
    "pytest-mock>=3.17.0",
    "pytest-describe>=3.2.0",
    "pytest-watch>=4.2.0",
    "pytest-timeout>=2.3.1",
    "pytest-split>=0.11.0",
    "allure-pytest>=2.16.2",
    "respx>=0.20.0",
    "hypothesis>=6.170.14",
    "markdown-it-py>=4.2.0",
    # Mutation testing
    "cosmic-ray>=8.7.0",
    "mutmut==3.8.1",
    # Linting & formatting
    "mypy>=2.4.1",
    "ruff==0.17.3",
    "bandit[toml]>=1.9.4",
    "detect-secrets>=1.4.0",
    # Git & release
    "pre-commit>=4.7.0",
    "commitizen>=4.19.3",
    # Explicit security floors for transitive dependencies prevent a future
    # lock re-resolution from selecting vulnerable releases. These are dev
    # tooling dependencies, not additional product runtime requirements.
    "gitpython>=3.1.60",
    "aiohttp>=3.14.5",
    "multidict>=7.2.1",
    "certifi>=2026.10.23",
    "filelock>=4.2.7",
    # Task runner (replaces Pipfile [scripts]; run via `uv run poe <task>`)
    "poethepoet>=0.49.0",
    # Utilities
    "fpdf2>=2.9.0",
    "pillow>=13.0.0",
    "click>=8.5.0",
    "colorama>=0.4.0",
    "tqdm>=4.70.1",
    # Token measurement (advisory, dev-only) — DDD-1
    "tiktoken>=0.14.0",
    # E2E container testing
    "testcontainers>=4.15.0",
    "docker>=7.2.0",
    # JSON Schema validation (used by the outcomes registry)
    "jsonschema>=4.0.0",
    # Packaging (python -m build / scripts/build_dist.py).  ``--no-isolation``
    # deliberately uses this environment, so it must contain the declared
    # backend as well as the frontend.
    "build>=1.6.1",
    "hatchling>=1.33.0",
    # pip — the WS-floor installable build leg shells `python -m pip wheel`.
    # uv venvs OMIT pip by default
    # (unlike the prior pipenv venv), so it MUST be declared or every
    # build-leg test fails with
    # "No module named pip". Env-parity restore after the pipenv->uv merge.
    "pip>=26.3"
]

[project.urls]
Homepage = "https://github.com/nWave-ai/nWave"
Documentation = "https://github.com/nWave-ai/nWave#readme"
Repository = "https://github.com/nWave-ai/nWave"
Issues = "https://github.com/nWave-ai/nWave/issues"

[project.scripts]
nwave-ai = "nwave_ai.cli:main"
nwdes = "nwdes.shell.cli:main"
code-fact = "codefact.shell.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Anchor every collected module under its full rootdir-relative path so
# importlib mode assigns unique module names. Hyphenated test directories
# (e.g. plugin-architecture/, skill-restructuring/) cannot form valid dotted
# package paths; without this, pytest truncates such modules to their bare
# basename (test_walking_skeleton, acceptance) and same-named modules across
# the tree collide ("import file mismatch" / "No module named acceptance.conftest").
consider_namespace_packages = true
# Set strictness via ini booleans rather than addopts flags: pytest 9.0.x silently
# ignored --strict-markers/--strict-config passed through addopts (regression
# fixed in 9.1.0, pytest #14442). The ini booleans are immune to that regression
# class and enforce the same gate.
strict_markers = true
strict_config = true
# Global per-test hang-catcher (#19, pytest-timeout). Generous on purpose: a
# speed-limiter false-fails legitimate slow tests, a hang-catcher only
# interrupts a true infinite loop/deadlock. Slowest known test today is
# ~130s (BuildTier) so 600s leaves 4.6x margin. `thread` (not the default
# `signal`) because CI runs pytest-xdist `-n auto` (.github/workflows/ci.yml)
# and the signal-based timeout is unreliable in xdist worker processes.
timeout = 600
timeout_method = "thread"
# pytest removes each test's tmp_path when the test ends, passing or failing.
tmp_path_retention_policy = "none"
addopts = [
    "-ra",
    "-q",
    "--import-mode=importlib",
    # pytest-pspec rewrites nodeids to shared docstrings even without --pspec,
    # collapsing parametrized cases in xdist's loadfile/loadgroup schedulers.
    # Block stale installs even after removal from the dev dependencies.
    "-p",
    "no:pspec",
    # pytest-describe-it 0.1.0 rewrites item._nodeid in pytest_itemcollected; pytest 9.2
    # removed that attribute, so collection crashes. No test used its markers, so it was
    # removed from the dev dependencies. Block stale installs the same way as pspec.
    "-p",
    "no:describe-it",
    # Owner-requested slowest-first visibility above the 10 ms budget.
    # Full/CI runs retain this report; the touched-file commit gate disables
    # it in its own pytest plugin so passing neighbours remain silent.
    "--durations=0",
    "--durations-min=0.01",
    # Formal TLC tests run in spine-formal-verify instead of the default feedback
    # suite. (The former `broken_schema_v0` exclusion was dropped: no test carries
    # that marker any more, and pytest 9.2 rejects unregistered markers in -m.)
    "-m",
    "not formal_tlc",
]
markers = [
    "acceptance: Acceptance tests (BDD scenarios, may be slow)",
    "canary: Canary skill injection detection tests (ADR-006)",
    "e2e_smoke: Critical-path e2e subset run in pre-push on master (privacy contract, behavioral smoke, packaging shape, cross-platform contract). Full e2e remains gated by CI on PR.",
    "e2e: End-to-end acceptance tests",
    "fast_gate: Fast source-level regression guards run pre-commit/pre-push",
    "formal_tlc: Native TLC model checks run explicitly in the CI formal-verification job",
    "integration: Integration tests (may use external resources)",
    "live_api: Tests that call paid external APIs (e.g. OpenAI); skipped unless relevant API key env var is set",
    "negative_at: Negative acceptance test -- asserts the WRONG outcome is NOT produced (GS-8). Detected by the negative-AT verifier (explicit alternative to the _not_/_never_/_rejects_/_refuses_/_fails_ name convention).",
    "polyglot_smoke: Polyglot pilot smoke tests (per-pilot toolchain required: Node/npm for TS, dotnet for C#, cargo for Rust). Skipped automatically when toolchain absent.",
    "probe_test: Tests that exercise substrate probe wiring (opt-out from _silence_probe autouse)",
    "retired: Scenario witnessed a mechanism that was deliberately retired (not merely unbuilt) -- see the .feature file's comment block for the removal rationale. Distinct from `skip`/`pending` (unfinished RED scaffold).",
    "slice_01: Slice-01 traceability marker applied as a Python marker (pytest.mark.slice_01).",
    "slow: Expensive tests; skipped unless --run-slow is passed (enforced in tests/conftest.py)",
    "unit: Unit tests (fast, isolated)",
    "walking_skeleton: Walking-skeleton acceptance tests applied as a Python marker (pytest.mark.walking_skeleton); distinct from the gherkin @walking_skeleton tag consumed by pytest_bdd_apply_tag.",
    "wiring_e2e: Walking-skeleton integration tests that wire spine CLIs together via real subprocess against a realistic tmp project (proves end-to-end composition, not isolated fixtures).",
]
# Suppress PytestUnknownMarkWarning floods from pytest-bdd dynamic
# tag-to-mark conversion. Each pytest-bdd scenario tag (e.g. @slice-01,
# @walking_skeleton, @contract-shape:*, @feature-*) is auto-converted into a
# pytest.mark.<tag> via getattr(pytest.mark, tag) at collection time
# (pytest_bdd/plugin.py:137); registering every transient feature/slice tag
# in the markers table above is impractical because new tags accrue per
# feature wave (slice-NN, contract-shape:*, feature-*) and would force a
# pyproject.toml edit per new feature.
#
# The suppression is scoped to PytestUnknownMarkWarning ONLY — other warning
# classes (DeprecationWarning, UserWarning, hypothesis warnings) continue to
# surface. The first-class registered marks above retain --strict-markers
# enforcement (pytest-bdd dynamic getattr is not caught by --strict-markers).
#
# Closes friction #14 F-PRE-PUSH-PYTEST-STDOUT-OVERFLOW (BlockingIOError on
# stdout pipe drain) and friction #28 F-PRECOMMIT-STREAM-BUFFER-FLAKINESS
# mechanically: 9 warning records per known-noisy collection (46 lines)
# collapse to ZERO warning records (≤ 6 lines), eliminating the pipe-buffer
# fill race condition empirically surfaced on slice-04 pre-push 2026-05-28.
#
# Feature: fix-cicd-warning-suppress slice-01 (Slice-Id: slice-01).
# AT-1 absent-warnings + AT-2 bounded-output-size GREEN per DISTILL
# at-scaffold-notes-slice-01.md.
filterwarnings = [
    "ignore::pytest.PytestUnknownMarkWarning",
]
norecursedirs = [
    ".hypothesis",
    ".venv",
    ".venv-mutation",
    "mutants",
    "node_modules",
    ".git",
    "__pycache__",
    "reports",
    "docs",
    ".nwave",
    ".claude",
    "target",
]
asyncio_mode = "auto"

[tool.coverage.run]
# Default CI covers the active shipped runtime and every shipped package.
source = ["src/nwdes", "src/nwave_capture", "src/codefact", "nwave_ai", "scripts/install", "scripts/shared"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "scripts/install/install_nwave_target_hooks.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:"
]
fail_under = 75
show_missing = true

[tool.mutmut]
# Schema note (2026-08-10): mutmut 3.6 uses array-valued `source_paths` /
# `pytest_add_cli_args_test_selection` and has no `runner`/string `paths_to_mutate` key.
source_paths = ["scripts/install"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "PL",     # Pylint
    "RUF"     # Ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "PLR2004", # magic value in comparison (too noisy)
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLC0415", # import not at top of file (intentional lazy loading)
    "ARG001",  # unused function argument (common in callbacks/fixtures)
    "ARG002",  # unused method argument (common in overrides)
    "ARG005",  # unused lambda argument
    "PTH123",  # open() vs Path.open() (stylistic)
    "B904",    # raise from err (stylistic in some cases)
    "SIM102",  # nested if (sometimes clearer)
    "SIM105",  # try-except-pass (sometimes intentional)
    "SIM117",  # multiple with statements (stylistic)
    "SIM115",  # open without context manager (sometimes necessary)
    "RUF012",  # mutable class attributes (too noisy)
    "RUF001",  # ambiguous unicode (false positives)
    "PTH118",  # os.path.join (stylistic)
    "PTH119",  # os.path.basename (stylistic)
    "PTH207",  # glob.glob vs Path.glob (stylistic)
    "PTH109",  # os.getcwd (stylistic)
    "PTH110",  # os.path.exists (stylistic)
    "PTH112",  # os.path.isdir (stylistic)
    "PTH113",  # os.path.isfile (stylistic)
    "PTH122",  # os.path.splitext (stylistic)
    "PLW1510", # subprocess.run without check (handled separately)
    "PLR0124", # name compared to itself (edge case in tests)
    "SIM112",  # use env.get instead of ternary (stylistic)
    "RUF043",  # unused async (can be intentional)
    "PLW0603", # global statement (singleton pattern)
    "PLW2901", # loop variable overwritten (common pattern)
    # UP042 stays unconverted: StrEnum changes str()/format() output of
    # (str, Enum) members, so each enum needs an owner decision, not a rewrite.
    "UP042",   # replace-str-enum
]

[tool.ruff.lint.per-file-ignores]
# Import order left as it was (pre-existing).
"tests/installer/acceptance/test_installed_specialist_knowledge.py" = ["I001"]
# Tests can have more relaxed rules
"tests/**/*.py" = [
    "PLW1510",  # subprocess.run without check
    "B007",     # unused loop variable
    "B008",     # function call in default argument (fixtures)
    "RUF001",   # ambiguous unicode
    "RUF002",   # ambiguous unicode in docstrings — same class as RUF001, test prose
    "TC001",    # first-party type in TYPE_CHECKING — test composition classes used at runtime
    "TC002",    # third-party type in TYPE_CHECKING — same runtime-usage rationale
    "TC003",    # stdlib Path in TYPE_CHECKING — test files use Path at runtime via tmp_path
    "RUF005",   # list concatenation — acceptable in test code
    "F811",     # pytest-bdd false positive: fixture imported then injected as a step param
    "F403",     # `from steps import *` — pytest-bdd shared-step aggregation idiom
    "F405",     # name may be from star import — companion of F403 for shared steps
    "E402",     # import after sys.path-insert / scenarios() — pytest-bdd registration idiom
]
# Hook scripts may need inline imports
"scripts/hooks/**/*.py" = [
    "PLW1510",  # subprocess.run without check
]
# PLR0913 is ENFORCED repo-wide with NO per-file grandfathering. Every violation is
# either refactored away or suppressed per FUNCTION at its own definition, with a
# comment there saying why that arity is a design fact: a port contract its adapters
# must match, a pluggy hook whose signature pytest owns, a test function whose
# parameters are fixtures injected by name, a helper forwarding genuine
# `subprocess.run` keywords, or a test-data builder whose call sites vary one field.
#
# Per FUNCTION is the point. A `per-file-ignores` entry exempted a whole FILE, so a new
# over-argument function added to it was never reported. An inline `# noqa: PLR0913`
# exempts one definition and leaves every other function in that file gated.
#
# THE DEBT IS NOT ZERO, and seeing it needs `--ignore-noqa`, because a plain
# `ruff check` prints "All checks passed!" whether the figure is 0 or 33:
#   uv run ruff check --ignore-noqa --select PLR0913 --statistics src/ scripts/ tests/
# 33 on 2026-09-27. Nothing verifies that number against the tree, so treat the command
# as the source of truth and this line as a hint; a gate to close that gap is filed in
# techdebt.md.
#
# Adding a new `per-file-ignores` PLR0913 row would reopen the hole this closed.
# Suppress the one function, at the function, with the reason.

[tool.ruff.lint.isort]
known-first-party = ["crafter_ai", "nwave_ai", "scripts"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.commitizen]
# WARNING: the tool.commitizen.version is tracking the LAST STABLE version and is updated by the pipeline!
# DON'T TOUCH IT!
version = "4.3.0"
version_scheme = "pep440"
version_files = [
    "nWave/VERSION",
    "nWave/framework-catalog.yaml:version",
]
tag_format = "v$version"
name = "cz_conventional_commits"
commit_parser = "conventional"
changelog_file = "CHANGELOG.md"
major_version_zero = false
bump_message = "chore(release): v$new_version [skip ci]"
update_changelog_on_bump = true

[tool.poe.tasks]
# Dev task runner — replaces the former Pipfile [scripts] block.
# Run with: `uv run poe <task>` (or `poe <task>` inside an activated .venv).
# Testing (alphabetical)
mutation-test    = "mutmut run"
test             = "python -m pytest tests/ --tb=short --color=yes"
test-fast        = "python -m pytest tests/ -n 4 --dist loadgroup --tb=short --color=yes"
test-acceptance  = "python -m pytest tests/installer/acceptance/ tests/plugins/plugin-architecture/acceptance/ tests/bugs/ --tb=short --color=yes"
test-allure      = "python -m pytest tests/ --tb=short --alluredir=reports/allure-results --color=yes"
test-bugs        = "python -m pytest tests/bugs/ --tb=short --color=yes"
test-coverage    = "python -m pytest tests/ -q --cov=src --cov=scripts --cov-report=term-missing --cov-report=html:reports/htmlcov"
test-e2e         = "python -m pytest tests/installer/e2e/ tests/plugins/plugin-architecture/e2e/ --tb=short --color=yes"
test-full        = "python -m pytest tests/ --tb=short --cov=src --cov=scripts --cov-report=term-missing --cov-report=html:reports/htmlcov --html=reports/test-report.html --self-contained-html --alluredir=reports/allure-results --color=yes"
test-html        = "python -m pytest tests/ --tb=short --html=reports/test-report.html --self-contained-html --color=yes"
test-installer   = "python -m pytest tests/installer/ --tb=short --color=yes"
test-integration = "python -m pytest tests/plugins/plugin-architecture/integration/ --tb=short --color=yes"
test-not-slow    = "python -m pytest tests/ -m 'not slow' --tb=short --color=yes"
test-plugins     = "python -m pytest tests/plugins/ --tb=short --color=yes"
test-unit        = "python -m pytest tests/installer/unit/ tests/plugins/plugin-architecture/unit/ tests/plugins/install/ --tb=short --color=yes"
# Where did the wall-clock go? Reads .nwave/test-durations.jsonl, which the root
# conftest writes on EVERY run (poles AND the long tail the top-N window hides).
test-durations   = "python scripts/test_durations_report.py"
# Linting & formatting (alphabetical)
format           = "ruff format src/ scripts/ tests/"
format-check     = "ruff format --check src/ scripts/ tests/"
lint             = "ruff check src/ scripts/ tests/"
typecheck        = "mypy src/ nwave_ai/"
# Validation (alphabetical)
validate         = "python scripts/local_ci.py"
validate-fast    = "python scripts/local_ci.py --fast"
# On-demand local stand-in for the CI test run that no longer fires on every
# push (2026-08-23, GitHub Actions budget). Tiers run SERIALLY, memory-gated.
validate-tiers   = "python scripts/local_ci.py --tier all"
validate-changed = "python scripts/local_ci.py --changed"
validate-yaml    = "python scripts/validation/validate_yaml_files.py"
# Build, docs & hooks (alphabetical)
build            = "python scripts/build_dist.py"
docgen           = "python scripts/docgen.py"
install-hooks    = "python ${POE_ROOT}/scripts/hooks/in_place_hooks.py install"  # one-time per clone: writes the in-place stubs for every default_install_hook_types type into the repository's hooks dir; idempotent; stashes nothing
verify-hooks     = "python scripts/validation/verify_hooks.py"  # fails loudly unless every default_install_hook_types hook is an in-place stub, installed, and not bypassed by core.hooksPath
# Root board (dev only): `board` refreshes the Backlog.md view of the todo and serves
# the web board.
board            = "python scripts/dev/nwboard.py kanban"
