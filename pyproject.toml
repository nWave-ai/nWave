[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nwave_ai"]

[tool.hatch.build.targets.wheel.force-include]
"nWave/agents" = "nWave/agents"
"nWave/scripts" = "nWave/scripts"
"nWave/skills" = "nWave/skills"
"nWave/tasks/nw" = "nWave/tasks/nw"
"nWave/templates" = "nWave/templates"
"nWave/framework-catalog.yaml" = "nWave/framework-catalog.yaml"
"nWave/VERSION" = "nWave/VERSION"
"nWave/README.md" = "nWave/README.md"
"scripts/install" = "scripts/install"
"scripts/shared" = "scripts/shared"
"scripts/install_nwave_target_hooks.py" = "scripts/install_nwave_target_hooks.py"
"scripts/validate_step_file.py" = "scripts/validate_step_file.py"
"lib/python/des" = "nWave/lib/python/des"
"schemas" = "schemas"

[project]
name = "nwave-ai"
version = "3.21.0"
description = "Modern CLI installer for nwave with rich terminal UI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "Michele Brissoni", email = "michele.brissoni@brix.consulting" },
    { name = "Alessandro Digioia", email = "alessandro.digioia@brix.consulting" }
]
contributors = [
    { name = "Fabio (@lagom1985)" }
]
keywords = [
    "cli",
    "installer",
    "ai",
    "developer-tools",
    "automation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Typing :: Typed"
]

dependencies = [
    "rich>=13.7.0",
    "typer>=0.26.7",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.14.2",
    "httpx>=0.27.0",
    "platformdirs>=4.2.0",
    "pyyaml>=6.0",
    "packaging>=21.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "typing_extensions>=4.0",
    "jsonschema>=4.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "pytest-bdd>=7.0.0",
    "respx>=0.20.0",
    "jsonschema>=4.0.0"
]

[dependency-groups]
# Local dev toolchain (PEP 735). Installed by default on `uv sync`.
# Not published in package metadata (unlike the `test` extra above).
dev = [
    # Testing
    "pytest>=9.1.1",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "pytest-bdd>=7.0.0",
    "pytest-describe-it>=0.1.0",
    "pytest-html>=4.0.0",
    "pytest-pspec>=0.0.4",
    "pytest-mock>=3.12.0",
    "pytest-describe>=3.2.0",
    "pytest-watch>=4.2.0",
    "allure-pytest>=2.13.0",
    "respx>=0.20.0",
    "hypothesis>=6.155.7",
    # Mutation testing
    "cosmic-ray>=8.4.0",
    "mutmut>=3.6.0",
    # Linting & formatting
    "mypy>=1.8.0",
    "ruff==0.15.20",
    "bandit[toml]>=1.9.4",
    "detect-secrets>=1.4.0",
    # Git & release
    "pre-commit>=3.6.0",
    "commitizen>=4.16.4",
    "gitlint>=0.19.0",
    # Task runner (replaces Pipfile [scripts]; run via `uv run poe <task>`)
    "poethepoet>=0.24",
    # Utilities
    "fpdf2>=2.7.0",
    "click>=8.0.0",
    "colorama>=0.4.0",
    "tqdm>=4.68.3",
    # Token measurement (advisory, dev-only) — DDD-1
    "tiktoken>=0.7.0",
    # E2E container testing
    "testcontainers>=4.0.0",
    "docker>=7.0.0",
    # JSON Schema validation (used by tests/outcomes + tests/feature_delta)
    "jsonschema>=4.0.0",
    # Packaging (python -m build / scripts/build_dist.py)
    "build>=1.2.0"
]

[project.urls]
Homepage = "https://github.com/nWave-ai/nWave"
Documentation = "https://github.com/nWave-ai/nWave#readme"
Repository = "https://github.com/nWave-ai/nWave"
Issues = "https://github.com/nWave-ai/nWave/issues"

[project.scripts]
nwave-ai = "nwave_ai.cli:main"
# The DES runtime ships as payload at nWave/lib/python/des (top-level `des`
# imports), not as an importable site-packages package. Direct des.cli.*
# entry points therefore crash with ModuleNotFoundError in an installed
# wheel — route through nwave_ai.des_entry, which puts the payload on
# sys.path first.
des-log-phase = "nwave_ai.des_entry:log_phase"
des-commit = "nwave_ai.des_entry:commit"
des-init-log = "nwave_ai.des_entry:init_log"
des-verify-integrity = "nwave_ai.des_entry:verify_integrity"
des-roadmap = "nwave_ai.des_entry:roadmap"
des-health-check = "nwave_ai.des_entry:health_check"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Set strictness via ini booleans rather than addopts flags: pytest 9.0.x silently
# ignored --strict-markers/--strict-config passed through addopts (regression
# fixed in 9.1.0, pytest #14442). The ini booleans are immune to that regression
# class and enforce the same gate.
strict_markers = true
strict_config = true
addopts = [
    "-ra",
    "-q",
    "--import-mode=importlib",
]
markers = [
    "acceptance: Acceptance tests (BDD scenarios, may be slow)",
    "broken_schema_v0: Quarantined tests asserting internal pre-FM-1 (top-level array) hooks.json schema; superseded by tests/e2e/test_codex_real_boot.py per DDD-7 (codex-empirical-e2e-support / FM-4). Excluded by default CI selector via -m 'not broken_schema_v0'.",
    "canary: Canary skill injection detection tests (ADR-006)",
    "e2e_smoke: Critical-path e2e subset run in pre-push on master (privacy contract, behavioral smoke, packaging shape, cross-platform contract). Full e2e remains gated by CI on PR.",
    "e2e: End-to-end acceptance tests",
    "fast_gate: Fast source-level regression guards run pre-commit/pre-push",
    "integration: Integration tests (may use external resources)",
    "live_api: Tests that call paid external APIs (e.g. OpenAI); skipped unless relevant API key env var is set",
    "polyglot_smoke: Polyglot pilot smoke tests (per-pilot toolchain required: Node/npm for TS, dotnet for C#, cargo for Rust). Skipped automatically when toolchain absent.",
    "probe_test: Tests that exercise substrate probe wiring (opt-out from _silence_probe autouse)",
    "slice_01: Slice-01 traceability marker applied as a Python marker (pytest.mark.slice_01).",
    "slow: Tests that take longer to run",
    "unit: Unit tests (fast, isolated)",
    "walking_skeleton: Walking-skeleton acceptance tests applied as a Python marker (pytest.mark.walking_skeleton); distinct from the gherkin @walking_skeleton tag consumed by pytest_bdd_apply_tag.",
    "wiring_e2e: Walking-skeleton integration tests that wire spine CLIs together via real subprocess against a realistic tmp project (proves end-to-end composition, not isolated fixtures).",
]
norecursedirs = [
    ".venv",
    ".venv-mutation",
    "node_modules",
    ".git",
    "__pycache__",
    "reports",
    "docs",
    ".nwave",
    "target",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/des", "scripts/install"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "scripts/install/install_nwave_target_hooks.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:"
]
fail_under = 60
show_missing = true

[tool.mutmut]
paths_to_mutate = "src/des,scripts/install"
tests_dir = "tests/"
runner = "python -m pytest -x -q"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]
[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "PL",     # Pylint
    "RUF"     # Ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value in comparison (too noisy)
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLC0415", # import not at top of file (intentional lazy loading)
    "ARG001",  # unused function argument (common in callbacks/fixtures)
    "ARG002",  # unused method argument (common in overrides)
    "ARG005",  # unused lambda argument
    "PTH123",  # open() vs Path.open() (stylistic)
    "B904",    # raise from err (stylistic in some cases)
    "SIM102",  # nested if (sometimes clearer)
    "SIM105",  # try-except-pass (sometimes intentional)
    "SIM117",  # multiple with statements (stylistic)
    "SIM115",  # open without context manager (sometimes necessary)
    "RUF012",  # mutable class attributes (too noisy)
    "RUF001",  # ambiguous unicode (false positives)
    "PTH118",  # os.path.join (stylistic)
    "PTH119",  # os.path.basename (stylistic)
    "PTH207",  # glob.glob vs Path.glob (stylistic)
    "PTH109",  # os.getcwd (stylistic)
    "PTH110",  # os.path.exists (stylistic)
    "PTH112",  # os.path.isdir (stylistic)
    "PTH113",  # os.path.isfile (stylistic)
    "PTH122",  # os.path.splitext (stylistic)
    "PLW1510", # subprocess.run without check (handled separately)
    "PLR0124", # name compared to itself (edge case in tests)
    "SIM112",  # use env.get instead of ternary (stylistic)
    "RUF043",  # unused async (can be intentional)
    "PLW0603", # global statement (singleton pattern)
    "PLW2901", # loop variable overwritten (common pattern)
]

[tool.ruff.lint.per-file-ignores]
# Tests can have more relaxed rules
"tests/**/*.py" = [
    "PLW1510",  # subprocess.run without check
    "B007",     # unused loop variable
    "B008",     # function call in default argument (fixtures)
    "RUF001",   # ambiguous unicode
    "TC003",    # stdlib Path in TYPE_CHECKING — test files use Path at runtime via tmp_path
    "RUF005",   # list concatenation — acceptable in test code
]
# Hook scripts may need inline imports
"scripts/hooks/**/*.py" = [
    "PLW1510",  # subprocess.run without check
]
# Legacy DES test files referencing pre-hexagonal classes (ScopeValidationResult, RealSubagentStopHook, SubagentStopHook)
# These tests are skipped pending redesign - see DES hexagonal architecture migration
"tests/des/unit/adapters/drivers/hooks/test_audit_logging_integration.py" = ["F821"]
"tests/des/unit/adapters/drivers/hooks/test_clean_execution_silence.py" = ["F821"]
"tests/des/unit/adapters/drivers/hooks/test_scope_validation_integration.py" = ["F821"]
"tests/des/unit/application/test_orchestrator_recovery_integration.py" = ["F821"]
"tests/des/acceptance/test_us003_post_execution_validation.py" = ["F821"]
"tests/des/acceptance/test_post_execution_validation.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["crafter_ai", "des", "scripts"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.commitizen]
# WARNING: the tool.commitizen.version is tracking the LAST STABLE version and is updated by the pipeline!
# DON'T TOUCH IT!
version = "3.21.0"
version_scheme = "pep440"
version_files = [
    "nWave/VERSION",
    "nWave/framework-catalog.yaml:version",
]
tag_format = "v$version"
name = "cz_conventional_commits"
commit_parser = "conventional"
changelog_file = "CHANGELOG.md"
major_version_zero = false
bump_message = "chore(release): v$new_version [skip ci]"
update_changelog_on_bump = true

[tool.poe.tasks]
# Dev task runner — replaces the former Pipfile [scripts] block.
# Run with: `uv run poe <task>` (or `poe <task>` inside an activated .venv).
# Testing (alphabetical)
mutation-test    = "mutmut run --paths-to-mutate=src/des,scripts/install"
test             = "python -m pytest tests/ --pspec --tb=short --color=yes"
test-acceptance  = "python -m pytest tests/des/acceptance/ tests/installer/acceptance/ tests/plugins/plugin-architecture/acceptance/ tests/bugs/ --pspec --tb=short --color=yes"
test-allure      = "python -m pytest tests/ --pspec --tb=short --alluredir=reports/allure-results --color=yes"
test-bugs        = "python -m pytest tests/bugs/ --pspec --tb=short --color=yes"
test-coverage    = "python -m pytest tests/ -q --cov=src --cov=scripts --cov-report=term-missing --cov-report=html:reports/htmlcov"
test-des         = "python -m pytest tests/des/ --pspec --tb=short --color=yes"
test-des-unit    = "python -m pytest tests/des/unit/ --pspec --tb=short --color=yes"
test-e2e         = "python -m pytest tests/des/e2e/ tests/installer/e2e/ tests/plugins/plugin-architecture/e2e/ --pspec --tb=short --color=yes"
test-full        = "python -m pytest tests/ --pspec --tb=short --cov=src --cov=scripts --cov-report=term-missing --cov-report=html:reports/htmlcov --html=reports/test-report.html --self-contained-html --alluredir=reports/allure-results --color=yes"
test-html        = "python -m pytest tests/ --pspec --tb=short --html=reports/test-report.html --self-contained-html --color=yes"
test-installer   = "python -m pytest tests/installer/ --pspec --tb=short --color=yes"
test-integration = "python -m pytest tests/des/integration/ tests/plugins/plugin-architecture/integration/ --pspec --tb=short --color=yes"
test-not-slow    = "python -m pytest tests/ -m 'not slow' --pspec --tb=short --color=yes"
test-plugins     = "python -m pytest tests/plugins/ --pspec --tb=short --color=yes"
test-unit        = "python -m pytest tests/des/unit/ tests/installer/unit/ tests/plugins/plugin-architecture/unit/ tests/plugins/install/ --pspec --tb=short --color=yes"
# Linting & formatting (alphabetical)
format           = "ruff format src/ scripts/ tests/"
format-check     = "ruff format --check src/ scripts/ tests/"
lint             = "ruff check src/ scripts/ tests/"
typecheck        = "mypy src/des/"
# Validation (alphabetical)
validate         = "python scripts/local_ci.py"
validate-fast    = "python scripts/local_ci.py --fast"
validate-yaml    = "python scripts/validation/validate_yaml_files.py"
# Build, docs & hooks (alphabetical)
build            = "python scripts/build_dist.py"
docgen           = "python scripts/docgen.py"
install-hooks    = "pre-commit install --install-hooks --overwrite"  # all hook types via default_install_hook_types; --overwrite forces a clean install (no migration-mode chaining of a stale/foreign hook)
verify-hooks     = "python scripts/validation/verify_hooks.py"  # fails loudly unless every default_install_hook_types hook is installed, pre-commit-managed, and not bypassed by core.hooksPath
